<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Trailstamp Password</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Figtree:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="site.css"></head>
<body><main><header><img src="icon.png" alt=""><b>Trailstamp</b></header>
<h1>Set a new password</h1>
<form class="card" id="f"><label for="pw">New password</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required>
<button id="go">Save password</button><p id="msg" class="muted" role="status"></p></form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
// Same two values as www/config.js in the app.
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co", SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const msg = t => document.getElementById("msg").textContent = t;
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const pw = document.getElementById("pw").value;
  if (pw.length < 8) return msg("Use at least 8 characters.");
  const { error } = await sb.auth.updateUser({ password: pw });
  msg(error ? "That link has expired. Request a new one from the app." : "Password saved. Go back to Trailstamp and sign in.");
});
</script></main></body></html>
