# Builds a signed Android App Bundle (.aab) for Google Play.
# Run it from GitHub: Actions tab > "Build Android" > Run workflow.
# When it finishes, download "waypoint-aab" from the run page and upload it in Play Console.
name: Build Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.WAYPOINT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the WAYPOINT_KEYSTORE_BASE64 secret first (see SETUP.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks

      - name: Build signed bundle
        working-directory: android
        env:
          WAYPOINT_KEYSTORE: upload.jks
          WAYPOINT_KEYSTORE_PASSWORD: ${{ secrets.WAYPOINT_KEYSTORE_PASSWORD }}
          WAYPOINT_KEY_ALIAS: ${{ secrets.WAYPOINT_KEY_ALIAS }}
          WAYPOINT_KEY_PASSWORD: ${{ secrets.WAYPOINT_KEYSTORE_PASSWORD }}
          WAYPOINT_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove key
        if: always()
        run: rm -f android/app/upload.jks
