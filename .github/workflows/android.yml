# Builds a signed Android App Bundle (.aab) for Google Play.
# Run it from GitHub: Actions tab > "Build Android" > Run workflow.
# When it finishes, download "trailstamp-aab" from the run page and upload it in Play Console.
name: Build Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAILSTAMP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the TRAILSTAMP_KEYSTORE_BASE64 secret first (see SETUP.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks

      - name: Build signed bundle
        working-directory: android
        env:
          TRAILSTAMP_KEYSTORE: upload.jks
          TRAILSTAMP_KEYSTORE_PASSWORD: ${{ secrets.TRAILSTAMP_KEYSTORE_PASSWORD }}
          TRAILSTAMP_KEY_ALIAS: ${{ secrets.TRAILSTAMP_KEY_ALIAS }}
          TRAILSTAMP_KEY_PASSWORD: ${{ secrets.TRAILSTAMP_KEYSTORE_PASSWORD }}
          TRAILSTAMP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          # Check the key first so a wrong secret gives a clear message.
          if ! keytool -list -keystore app/upload.jks -storepass "$TRAILSTAMP_KEYSTORE_PASSWORD" -alias "$TRAILSTAMP_KEY_ALIAS" > /tmp/key.txt 2>&1; then
            echo "::error::Signing key check failed: $(tr '\n' ' ' < /tmp/key.txt | cut -c1-300). Check the TRAILSTAMP_KEYSTORE_PASSWORD and TRAILSTAMP_KEY_ALIAS secrets."
            exit 1
          fi
          set +e
          ./gradlew bundleRelease --no-daemon > /tmp/gradle.log 2>&1
          code=$?
          set -e
          tail -n 200 /tmp/gradle.log
          if [ $code -ne 0 ]; then
            msg=$(sed -n '/What went wrong/,/Try:/p' /tmp/gradle.log | head -n 25 | tr '\n' ' ' | cut -c1-1500)
            echo "::error::Gradle: ${msg:-see log}"
            grep -E "^e: |error:|ERROR" /tmp/gradle.log | head -n 8 | while read -r l; do echo "::error::$l"; done
            exit $code
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: trailstamp-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove key
        if: always()
        run: rm -f android/app/upload.jks
